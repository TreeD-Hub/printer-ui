name: Release UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ui-main
  cancel-in-progress: false

jobs:
  release-ui:
    name: Build and release UI bundle
    runs-on: ubuntu-latest
    env:
      UI_ARCHIVE_NAME: treed-shell-ui.zip
      UI_RELEASE_TAG: ui-main-${{ github.run_number }}-${{ github.run_attempt }}
      CORE_CONTRACT_FIXTURE: printer-core/contracts/printer-protocol.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout active printer-core protocol
        uses: actions/checkout@v4
        with:
          repository: TreeD-Hub/printer-core
          ref: treed-v2
          path: printer-core
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for kiosk smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run quality gate
        run: |
          test -s "$CORE_CONTRACT_FIXTURE"
          npm run quality:pr

      - name: Pack verified logic package
        run: |
          mkdir -p artifacts
          npm pack --workspace @treed/printer-logic --ignore-scripts --pack-destination artifacts

      - name: Upload logic package artifact
        uses: actions/upload-artifact@v4
        with:
          name: treed-printer-logic-package
          path: artifacts/*.tgz

      - name: Add UI build manifest
        run: |
          node -e "const fs = require('fs'); const logic = require('./packages/printer-logic/package.json'); fs.writeFileSync('dist/treed-shell-ui-manifest.json', JSON.stringify({ name: 'treed-shell-ui', mode: 'live', ref: process.env.GITHUB_REF_NAME, sha: process.env.GITHUB_SHA, runNumber: process.env.GITHUB_RUN_NUMBER, runAttempt: process.env.GITHUB_RUN_ATTEMPT, logicPackage: '@treed/printer-logic', logicVersion: logic.version, logicWorkspace: 'packages/printer-logic', builtAt: new Date().toISOString() }, null, 2) + '\n')"

      - name: Pack UI bundle
        run: |
          cd dist
          zip -r "../${UI_ARCHIVE_NAME}" .

      - name: Write release notes
        run: |
          {
            echo "treed-shell UI bundle for printer loader."
            echo ""
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Mode: live"
            echo "Asset: ${UI_ARCHIVE_NAME}"
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${UI_RELEASE_TAG}" "${UI_ARCHIVE_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TreeD Shell · Release 0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release-notes.md
