name: Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout active printer-core protocol
        uses: actions/checkout@v4
        with:
          repository: TreeD-Hub/printer-core
          ref: treed-v2
          path: printer-core
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run PR quality gate
        run: npm run quality:pr

      - name: Check printer-core protocol compatibility
        env:
          CORE_CONTRACT_FIXTURE: printer-core/contracts/printer-protocol.json
        run: npx vitest run src/core/transport/coreProtocolCompatibility.test.ts --pool=forks
